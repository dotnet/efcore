name: scaffolding
description: Evaluates reverse-engineering guidance against EF Core scaffolding implementation and tests.
type: capability
defaults:
  runs: ${RUNS=5}
  timeout: 5m
  model: ${MODEL=gpt-5.6-sol}
  judge_model: ${JUDGE_MODEL=gpt-5.6-terra}
  executor: copilot-sdk
agent_environment:
  skills:
    - ../../../../.agents/skills/scaffolding
stimuli:
  - name: preserve-schema-filter-semantics
    prompt: |-
      Inspect the staged SQL Server schema reader, database creator, and SQL baselines. A target engine does not support the correlated `NOT EXISTS` used to exclude tables carrying the `microsoft_database_tools_support` extended property. A proposal replaces it with a `LEFT JOIN` to `sys.extended_properties`, includes the property-name predicate in the join, and filters for `ep.major_id IS NULL`. Write analysis.md reviewing the rewrite and focused validation. Do not edit source.
    constraints: &short_constraints
      max_turns: 40
      max_tokens: 750000
      max_duration: 5m
    agent_environment:
      files:
        - src: ../../../../src/EFCore.SqlServer/Scaffolding/Internal/SqlServerDatabaseModelFactory.cs
          dest: src/EFCore.SqlServer/Scaffolding/Internal/SqlServerDatabaseModelFactory.cs
        - src: ../../../../src/EFCore.SqlServer/Storage/Internal/SqlServerDatabaseCreator.cs
          dest: src/EFCore.SqlServer/Storage/Internal/SqlServerDatabaseCreator.cs
        - src: ../../../../test/EFCore.SqlServer.FunctionalTests/Query/NorthwindMiscellaneousQuerySqlServerTest.cs
          dest: test/EFCore.SqlServer.FunctionalTests/Query/NorthwindMiscellaneousQuerySqlServerTest.cs
    rubric:
      - >-
        The analysis recognizes that a LEFT JOIN containing the full excluded-property predicate in `ON`, followed by `ep.major_id IS NULL`, preserves anti-semi semantics when `major_id` is non-null; unrelated property rows do not join.
      - It verifies that the complete minor-id, class, and property-name predicates remain in `ON`, or proposes an equivalent non-correlated anti-set such as `NOT IN`.
      - It updates the schema-reader and database-creator occurrences plus their SQL baselines, and adds/identifies coverage with multiple extended properties on one object.
    graders:
      - type: file-matches
        config:
          path: analysis.md
          pattern: (?i)(?=[\s\S]*(LEFT JOIN|left join))(?=[\s\S]*(mixed (?:extended )?propert|multiple catalog rows|same (?:object|table)|both the support marker))(?=[\s\S]*(NOT IN|anti[ -]?set|anti[ -]?semi))[\s\S]+
      - type: prompt
        config:
          scoring: binary
          threshold: 1.0
          evidence: [ trajectory, repo ]
      - type: token-budget
        config:
          max: 750000
scoring:
  weights:
    file-matches: 0.27
    prompt: 0.63
    token-budget: 0.1
  threshold: 0.75
