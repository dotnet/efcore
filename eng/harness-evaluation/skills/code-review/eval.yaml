name: code-review
description: Evaluates evidence-backed EF Core review behavior, API compatibility, concurrency, test-gap detection, and false-positive restraint.
type: capability
defaults:
  runs: ${RUNS=5}
  timeout: 10m
  model: ${MODEL=gpt-6.1-sol}
  judge_model: ${JUDGE_MODEL=gpt-6.1-terra}
  judge_reasoning_effort: ${JUDGE_REASONING_EFFORT=medium}
  executor: copilot-sdk
agent_environment:
  skills:
    - ../../../../.agents/skills/code-review
stimuli:
  - name: review-validation-relocation-across-inheritance
    prompt: |-
      Review the staged proposed ModelValidator.cs implementation and ModelValidatorTest.cs snapshots. Write review.md. Do not edit source or access GitHub.
    constraints: &review_constraints
      max_turns: 50
      max_tokens: 1000000
      max_duration: 10m
    agent_environment:
      files:
        - src: ../../../../.github/copilot-instructions.md
          dest: .github/copilot-instructions.md
        - src: fixtures/model-validator-relocation/ModelValidator.cs
          dest: src/EFCore/Infrastructure/ModelValidator.cs
        - src: fixtures/model-validator-relocation/ModelValidatorTest.cs
          dest: test/EFCore.Tests/Infrastructure/ModelValidatorTest.cs
    rubric:
      - The review identifies that a not-auto-loaded property declared on a base type is no longer checked against a derived type constructor binding because the relocated validation only examines the declaring structuralType.
      - It requires checking constructor bindings across the declaring type and its derived types, using the consuming type in the diagnostic.
      - It calls out both the stale ValidateAutoLoaded XML summary and the missing regression test for a base property consumed by a derived constructor.
    graders:
      - type: file-matches
        config:
          path: review.md
          pattern: (?i)(?=[\s\S]*(derived|inherit))(?=[\s\S]*(constructor.?binding|ConstructorBinding))(?=[\s\S]*(base|declar))(?=[\s\S]*(test|coverage))[\s\S]+
      - type: prompt
        config:
          scoring: binary
          threshold: 1.0
          evidence: [ trajectory, repo ]
      - type: token-budget
        config:
          max: 1000000
  - name: catch-concurrency-detector-flag-ownership-race
    prompt: |-
      Review the implementation and test changes between the before/ and proposed/ snapshot directories. Write review.md. Do not edit source or access GitHub.
    constraints: *review_constraints
    agent_environment:
      files:
        - src: ../../../../.github/copilot-instructions.md
          dest: .github/copilot-instructions.md
        - src: fixtures/concurrency-detector/before/ConcurrencyDetector.cs
          dest: before/src/EFCore/Infrastructure/Internal/ConcurrencyDetector.cs
        - src: fixtures/concurrency-detector/before/ConcurrencyDetectorTest.cs
          dest: before/test/EFCore.Tests/Infrastructure/Internal/ConcurrencyDetectorTest.cs
        - src: fixtures/concurrency-detector/proposed/ConcurrencyDetector.cs
          dest: proposed/src/EFCore/Infrastructure/Internal/ConcurrencyDetector.cs
        - src: fixtures/concurrency-detector/proposed/ConcurrencyDetectorTest.cs
          dest: proposed/test/EFCore.Tests/Infrastructure/Internal/ConcurrencyDetectorTest.cs
    rubric:
      - >-
        The review locates the defect in the new catch predicate: `_currentContextRefCount == 0` describes completed per-detector bookkeeping, not whether this invocation acquired `_inCriticalSection`. The baseline instead retains the successful CompareExchange result before the allocating AsyncLocal write.
      - >-
        It gives a feasible interleaving: flow A successfully acquires the target detector's flag but pauses before EnterCurrentContext increments its ref count; flow B already holds a different detector, so its shared static AsyncLocal count is nonzero and it passes the target's acquisition guard despite losing CompareExchange; B's AsyncLocal write fails before its bookkeeping completes, and B's catch clears A's flag while the target ref count is still zero; an unrelated flow C can then enter while A resumes its critical section.
      - >-
        It requires preserving this invocation's acquisition result across helper boundaries and clearing the flag on failure only for the invocation that acquired it, without substituting the shared AsyncLocal count, resetting another detector's state, or forbidding existing nested entry.
      - >-
        It requests deterministic coverage that pauses the successful acquisition before bookkeeping, gives the failing contender an existing scope on another detector, and injects failure at the AsyncLocal write rather than relying on an actual out-of-memory event. An unrelated flow must remain rejected until the rightful owner's outermost scope exits; the added nesting test does not exercise this failure path.
      - >-
        Its failure-path coverage also includes successful acquisition followed by an AsyncLocal write failure before ownership bookkeeping, with the caller already holding another detector. The target flag must be released despite the preexisting nonzero AsyncLocal count, and the other detector's scope must remain intact; this rules out a cleanup fix based on AsyncLocal being zero.
      - >-
        It distinguishes the cleanup regression from the behavior-preserving helper extraction and ordinary cross-detector nesting, and does not claim that the proposed snapshots are missing or that the new nesting test itself proves the race fixed.
    graders:
      - type: file-matches
        config:
          path: review.md
          pattern: (?i)(?=[\s\S]*(CompareExchange|acquired))(?=[\s\S]*(ownership|other thread|interleav|race))(?=[\s\S]*(boolean|this (?:call|invocation)|only clear))[\s\S]+
      - type: prompt
        config:
          scoring: binary
          threshold: 1.0
          evidence: [ trajectory, repo ]
      - type: token-budget
        config:
          max: 1000000
  - name: review-breaking-dbset-public-api
    prompt: |-
      Review the source and test changes between the before/ and proposed/ snapshot directories, with the staged context and consumer snapshots. Write review.md. Do not edit source or access GitHub.
    constraints: *review_constraints
    agent_environment:
      files:
        - src: ../../../../.github/copilot-instructions.md
          dest: .github/copilot-instructions.md
        - src: fixtures/dbset-sequence/before/DbSet.cs
          dest: before/src/EFCore/DbSet.cs
        - src: fixtures/dbset-sequence/before/InternalDbSet.cs
          dest: before/src/EFCore/Internal/InternalDbSet.cs
        - src: fixtures/dbset-sequence/before/DbSetTest.cs
          dest: before/test/EFCore.Tests/DbSetTest.cs
        - src: fixtures/dbset-sequence/proposed/DbSet.cs
          dest: proposed/src/EFCore/DbSet.cs
        - src: fixtures/dbset-sequence/proposed/InternalDbSet.cs
          dest: proposed/src/EFCore/Internal/InternalDbSet.cs
        - src: fixtures/dbset-sequence/proposed/DbSetTest.cs
          dest: proposed/test/EFCore.Tests/DbSetTest.cs
        - src: fixtures/dbset-sequence/context/DbContext.cs
          dest: context/src/EFCore/DbContext.cs
        - src: fixtures/dbset-sequence/DbSetConsumer.cs
          dest: test/Compatibility/DbSetConsumer.cs
    rubric:
      - >-
        The review identifies the removal of the supported virtual DbSet<TEntity>.FindAsync(object?[]?, CancellationToken) member, even though the params-array sibling remains and InternalDbSet's override is updated in the proposed snapshot. It checks the staged DbSet and DbContext Find/FindAsync families rather than inferring the contract from the new adapter alone.
      - >-
        It explains the concrete binary and extension-point consequences using DbSetConsumer.cs: Client.ReadAsync compiled against the baseline references the old array-and-token member, which the proposed assembly no longer contains; CachedSet's original array-signature override cannot service the new IEnumerable virtual slot. Coordinated recompilation of InternalDbSet and array calls that still compile do not preserve either contract. A compiler-only complaint about recompiling CachedSet is not sufficient.
      - >-
        It gives a concrete source-binding comparison even if the old member were retained: a one-argument List<object?> call previously uses the expanded params overload with the list as one key value; the optional-token IEnumerable overload instead receives the list's contents as key values after recompilation. For the integer-key lookup represented by the new test this changes an invalid-key argument into a successful lookup. Ordinary object-array calls still prefer the params-array overload, so they do not demonstrate that sequence binding is unchanged.
      - >-
        It recommends preserving the shipped virtual signature and dispatch, not merely adding an array adapter in InternalDbSet or relying on the optional token. It defers the new surface absent demonstrated need beyond passing a sequence through the existing array API; any endorsed additive design must address the one-argument binding change and explicitly require its XML contract and focused behavioral tests.
      - >-
        It identifies the coverage limit of FindAsync_accepts_key_sequences: rebuilding the new base and internal override together and checking tracked list and array lookups does not exercise a consumer compiled against the old assembly. It requests a two-version compiled-consumer/derived-set compatibility check and before/after source-binding coverage, not an API-baseline update or a nonexistent lack of tests or proposed source.
      - >-
        It isolates signature, virtual dispatch, and overload-binding issues from the array-preserving materialization expression, which forwards null, arrays, and enumerated sequences to the same finder with the supplied cancellation token; it does not invent an independent cancellation or null-handling defect in that expression.
    graders:
      - type: file-matches
        config:
          path: review.md
          pattern: (?i)(?=[\s\S]*(FindAsync|DbSet))(?=[\s\S]*(breaking|compatib|preserve|retain|keep))(?=[\s\S]*(virtual|override|compiled caller|MissingMethodException))[\s\S]+
      - type: prompt
        config:
          scoring: binary
          threshold: 1.0
          evidence: [ trajectory, repo ]
      - type: token-budget
        config:
          max: 1000000
scoring:
  weights:
    file-matches: 0.18
    prompt: 0.72
    token-budget: 0.1
  threshold: 0.8