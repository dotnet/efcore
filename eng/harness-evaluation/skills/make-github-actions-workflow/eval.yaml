name: make-github-actions-workflow
description: Evaluates workflow authoring against EF Core's fork-safe PR automation.
type: capability
defaults:
  runs: ${RUNS=5}
  timeout: 5m
  model: ${MODEL=gpt-6.1-sol}
  judge_model: ${JUDGE_MODEL=gpt-6.1-terra}
  judge_reasoning_effort: ${JUDGE_REASONING_EFFORT=medium}
  executor: copilot-sdk
agent_environment:
  skills:
    - ../../../../.agents/skills/make-github-actions-workflow
stimuli:
  - name: create-external-pr-target-policy-workflow
    prompt: |-
      Inspect `.github/CONTRIBUTING.md` and the staged workflow for repository conventions. Create `.github/workflows/validate-external-pr-target.yml` to close and explain external pull requests that target servicing branches, while labeling newly opened external contributions. Maintainers must be able to edit or reopen pull requests without being incorrectly blocked, and automation accounts must be ignored. Do not check out or execute pull-request code.
    constraints:
      max_turns: 40
      max_tokens: 750000
      max_duration: 5m
    agent_environment:
      files:
        - src: ../../../../.github/CONTRIBUTING.md
          dest: .github/CONTRIBUTING.md
        - src: ../../../../.github/workflows/label-and-milestone-issues.yml
          dest: .github/workflows/label-and-milestone-issues.yml
    rubric:
      - The pull_request_target workflow handles opened, edited, and reopened events; edited events act only when the base changed, and the prohibited policy is scoped to release/* rather than requiring main.
      - Permission is checked once for `context.actor` and reused for branch closure and opened-event labeling; both the actor and PR author are excluded when they are bots.
      - Permissions are explicit and minimal, the action reference is an immutable SHA, no contributor code is checked out or executed, and API lookup failures avoid false-positive closure.
    graders:
      - type: file-matches
        config:
          path: .github/workflows/validate-external-pr-target.yml
          pattern: (?i)(?![\s\S]*actions/checkout)(?=[\s\S]*pull_request_target)(?=[\s\S]*opened)(?=[\s\S]*edited)(?=[\s\S]*reopened)(?=[\s\S]*changes\?*\.base)(?=[\s\S]*context\.actor)(?=[\s\S]*release/)(?=[\s\S]*community-contribution)[\s\S]+
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          evidence:
            - trajectory
            - diff
            - repo
      - type: token-budget
        config:
          max: 750000
scoring:
  weights:
    file-matches: 0.27
    prompt: 0.63
    token-budget: 0.1
  threshold: 0.75
