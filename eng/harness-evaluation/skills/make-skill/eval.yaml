name: make-skill
description: Evaluates correction of an inaccurate EF Core skill and its paired harness evaluation.
type: capability
defaults:
  runs: ${RUNS=5}
  timeout: 15m
  model: ${MODEL=gpt-6.1-sol}
  judge_model: ${JUDGE_MODEL=gpt-6.1-terra}
  executor: copilot-sdk
agent_environment:
  skills:
    - ../../../../.agents/skills/make-skill
stimuli:
  - name: repair-savechanges-pipeline-skill
    prompt: |-
      Inspect the staged SaveChanges implementation. Create corrected replacements for this proposed background skill at `.agents/skills/savechanges-pipeline/SKILL.md` and its paired evaluation at `eng/harness-evaluation/skills/savechanges-pipeline/eval.yaml`:

          ---
          name: SaveChanges Pipeline
          description: Information about EF Core.
          user-invocable: true
          ---

          DbContext.SaveChanges always calls DetectChanges. BatchExecutor always opens a new transaction, then StateManager always calls AcceptAllChanges. The relevant implementation files contain thousands of lines; tests are under test/.

      The proposed eval places the skill and all source fixtures together in its root environment, tells every stimulus to invoke the skill, checks only that `analysis.md` exists, and has no token budget or scoring threshold. Do not copy generic repository guidance into the corrected skill.
    constraints:
      max_turns: 50
      max_tokens: 750000
      max_duration: 15m
    agent_environment:
      files:
        - src: ../../../../src/EFCore/DbContext.cs
          dest: src/EFCore/DbContext.cs
        - src: ../../../../src/EFCore/ChangeTracking/Internal/StateManager.cs
          dest: src/EFCore/ChangeTracking/Internal/StateManager.cs
        - src: ../../../../src/EFCore.Relational/Update/Internal/BatchExecutor.cs
          dest: src/EFCore.Relational/Update/Internal/BatchExecutor.cs
        - src: ../../../../.github/copilot-instructions.md
          dest: .github/copilot-instructions.md
    rubric:
      - The corrected skill has matching `savechanges-pipeline` frontmatter, is non-user-invocable, removes volatile inventories, and contains stable behavioral guidance rather than generic repository rules.
      - It states that DbContext uses `TryDetectChanges`, StateManager accepts changes only when `acceptAllChangesOnSuccess` is true, and BatchExecutor conditionally creates transactions or savepoints based on existing transaction state and `AutoTransactionBehavior`.
      - The paired eval root targets only `savechanges-pipeline`; source fixtures are stimulus-local, prompts do not instruct activation or reveal expected answers, and grading includes deterministic, semantic, token-budget, bounded-resource, and threshold checks.
    graders:
      - type: file-matches
        config:
          path: .agents/skills/savechanges-pipeline/SKILL.md
          pattern: '(?im)(?=^---[\s\S]*^name:\s*savechanges-pipeline\s*$)(?=[\s\S]*^user-invocable:\s*false\s*$)(?=[\s\S]*TryDetectChanges)(?=[\s\S]*acceptAllChangesOnSuccess)(?=[\s\S]*AutoTransactionBehavior)(?=[\s\S]*savepoint)[\s\S]+'
      - type: file-matches
        config:
          path: eng/harness-evaluation/skills/savechanges-pipeline/eval.yaml
          pattern: '(?m)(?=[\s\S]*^name:\s*savechanges-pipeline\s*$)(?=[\s\S]*^agent_environment:\s*$)(?=[\s\S]*\.agents/skills/savechanges-pipeline)(?=[\s\S]*^stimuli:\s*$)(?=[\s\S]*token-budget)(?=[\s\S]*scoring:)(?=[\s\S]*threshold:)[\s\S]+'
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          evidence:
            - trajectory
            - repo
      - type: token-budget
        config:
          max: 750000
scoring:
  weights:
    file-matches: 0.36
    prompt: 0.54
    token-budget: 0.1
  threshold: 0.75