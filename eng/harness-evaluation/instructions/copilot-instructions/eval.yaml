name: copilot-instructions
description: Evaluates repository-wide Copilot guidance for EF Core implementation conventions and provider test hierarchies.
type: capability
defaults:
  runs: ${RUNS=5}
  timeout: 10m
  model: ${MODEL=gpt-5.6-sol}
  judge_model: ${JUDGE_MODEL=gpt-5.6-terra}
  executor: copilot-sdk
agent_environment:
  files:
    - src: ../../../../.github/copilot-instructions.md
      dest: .github/copilot-instructions.md
stimuli:
  - name: add-a-query-test-through-provider-hierarchies
    prompt: |-
      Inspect test/EFCore.Specification.Tests/Query/QueryTestBase.cs, test/EFCore.Specification.Tests/Query/NorthwindWhereQueryTestBase.cs, test/EFCore.SqlServer.FunctionalTests/Query/NorthwindWhereQuerySqlServerTest.cs, and test/EFCore.Sqlite.FunctionalTests/Query/NorthwindWhereQuerySqliteTest.cs. Write test-plan.md for adding a new Where_with_parameterized_limit case through this hierarchy, including result assertions, provider overrides, SQL baselines, and focused commands to validate it. Include repository setup and run each already-built provider test DLL directly with the repository's focused Microsoft Testing Platform conventions. Do not edit source.
    constraints:
      max_turns: 40
      max_tokens: 750000
      max_duration: 5m
    agent_environment:
      files:
        - src: ../../../../test/EFCore.Specification.Tests/Query/QueryTestBase.cs
          dest: test/EFCore.Specification.Tests/Query/QueryTestBase.cs
        - src: ../../../../test/EFCore.Specification.Tests/Query/NorthwindWhereQueryTestBase.cs
          dest: test/EFCore.Specification.Tests/Query/NorthwindWhereQueryTestBase.cs
        - src: ../../../../test/EFCore.SqlServer.FunctionalTests/Query/NorthwindWhereQuerySqlServerTest.cs
          dest: test/EFCore.SqlServer.FunctionalTests/Query/NorthwindWhereQuerySqlServerTest.cs
        - src: ../../../../test/EFCore.Sqlite.FunctionalTests/Query/NorthwindWhereQuerySqliteTest.cs
          dest: test/EFCore.Sqlite.FunctionalTests/Query/NorthwindWhereQuerySqliteTest.cs
    rubric:
      - The plan puts provider-independent behavior in the specification test and identifies every relevant staged provider override.
      - Provider overrides call the base test and use AssertSql only where SQL is produced.
      - The commands follow this repository's restore, activation, and focused Microsoft Testing Platform conventions without stale --no-build usage.
    graders:
      - type: file-matches
        config:
          path: test-plan.md
          pattern: (?i)(?=[\s\S]*Where_with_parameterized_limit)(?=[\s\S]*restore\.(?:cmd|sh))(?=[\s\S]*activate\.(?:ps1|sh))(?=[\s\S]*base)(?=[\s\S]*AssertSql)(?=[\s\S]*dotnet(?:\s+exec)?\s+[^\r\n]*SqlServer[^\r\n]*\.dll)(?=[\s\S]*dotnet(?:\s+exec)?\s+[^\r\n]*Sqlite[^\r\n]*\.dll)(?=[\s\S]*--filter-method)(?=[\s\S]*--filter-not-trait\s+["']?category=failing["']?)(?=[\s\S]*--ignore-exit-code\s+8)[\s\S]+
      - type: prompt
        config:
          scoring: binary
          threshold: 1.0
          evidence: [ trajectory, repo ]
          output_delivery: workspace
      - type: token-budget
        config:
          max: 750000
  - name: plan-a-provider-independent-async-api
    prompt: |-
      Inspect src/EFCore/DbContext.cs, src/EFCore/Properties/CoreStrings.resx and src/EFCore/EFCore.csproj. Write implementation-plan.md for adding a provider-independent public DbContext async method that accepts a CLR Type, activates it, awaits a callback, reports a new user-facing error, requires a new NuGet dependency, and adds a repository-specific build hook. Follow every applicable repository-wide implementation, file-placement, and validation convention. Do not edit source.
    constraints:
      max_turns: 50
      max_tokens: 1000000
      max_duration: 10m
    agent_environment:
      files:
        - src: ../../../../src/EFCore/DbContext.cs
          dest: src/EFCore/DbContext.cs
        - src: ../../../../src/EFCore/Properties/CoreStrings.resx
          dest: src/EFCore/Properties/CoreStrings.resx
        - src: ../../../../src/EFCore/EFCore.csproj
          dest: src/EFCore/EFCore.csproj
    rubric:
      - The plan places provider-independent behavior in EFCore and applies the public API documentation and compatibility requirements.
      - It avoids reflection/runtime generation where possible or applies appropriate NativeAOT annotations, and it requires ConfigureAwait(false) on the awaited callback.
      - It adds the user-facing message to CoreStrings.resx without hand-editing generated designer output and centralizes the package version in eng/Versions.props or Directory.Packages.props rather than EFCore.csproj.
      - It keeps the repository-specific build hook outside mirrored eng/common, preserves compatibility, and includes the repository API baseline test in focused validation.
    graders:
      - type: file-matches
        config:
          path: implementation-plan.md
          pattern: (?i)(?=[\s\S]*EFCore)(?=[\s\S]*(NativeAOT|trimming|RequiresDynamicCode|DynamicallyAccessedMembers))(?=[\s\S]*ConfigureAwait\(false\))(?=[\s\S]*CoreStrings\.resx)(?=[\s\S]*(eng/Versions\.props|Directory\.Packages\.props))(?=[\s\S]*(do not|avoid|outside|instead)[^\r\n]*eng[/\\]common)(?=[\s\S]*(EFCoreApiBaselineTest|EFCore\.ApiBaseline\.Tests))[\s\S]+
      - type: prompt
        config:
          scoring: binary
          threshold: 1.0
          evidence: [ trajectory, repo ]
          output_delivery: workspace
      - type: token-budget
        config:
          max: 1000000
scoring:
  weights:
    file-matches: 0.36
    prompt: 0.54
    token-budget: 0.1
  threshold: 0.8
