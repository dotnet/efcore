name: copilot-instructions
description: Evaluates repository-wide Copilot guidance while implementing EF Core API activation, resources, and regression tests.
type: capability
defaults:
  runs: ${RUNS=5}
  timeout: 25m
  model: ${MODEL=gpt-6.1-sol}
  judge_model: ${JUDGE_MODEL=gpt-6.1-terra}
  executor: copilot-sdk
agent_environment:
  files:
    - src: ../../../../.github/copilot-instructions.md
      dest: .github/copilot-instructions.md
stimuli:
  - name: implement-a-provider-independent-async-api
    prompt: |-
      Complete the unshipped API in activation-proposal.cs using the staged DbContext and resource files as context. It must obtain a handler from the caller's factory, optionally provide a fallback when that factory returns null, initialize the selected handler exactly once, and return it. Correct the proposal in activation-proposal.cs, make any needed resource additions, and write focused xUnit regression tests in activation-tests.cs. Preserve the factory-first behavior and do not modify the staged DbContext.cs. Write analysis.md explaining the implemented contract and validation limits. This is an offline snapshot task; do not install dependencies, connect to a database, or claim that the full EF Core suite was executed.
    constraints:
      max_turns: 65
      max_tokens: 1000000
      max_duration: 25m
    agent_environment:
      files:
        - src: fixtures/activation-proposal.cs
          dest: activation-proposal.cs
        - src: ../../../../src/EFCore/DbContext.cs
          dest: src/EFCore/DbContext.cs
        - src: ../../../../src/EFCore/Properties/CoreStrings.resx
          dest: src/EFCore/Properties/CoreStrings.resx
    rubric:
      - The agent implements the corrected API rather than only describing a plan. It belongs to Microsoft.EntityFrameworkCore.DbContext, treats the surface as unshipped, removes the areFallbacksEnabled naming violation, and supplies XML documentation for every parameter, the fallback contract, return value, and errors. It preserves factory-first behavior, exactly-once initialization, argument guards, and disposed-context behavior.
      - Both normal and fallback activation are NativeAOT-safe. The implementation uses explicit typed factories or suitably constrained generic construction; if reflection remains, it supplies precise preservation annotations on the types that actually reach Activator.CreateInstance. Merely mentioning AOT in analysis.md is insufficient. A typed handler factory must support handlers without a public parameterless constructor.
      - Every awaited initialization and fallback operation in the written implementation uses ConfigureAwait(false), including private helpers. The tests use an incomplete initialization task and a custom synchronization context to distinguish actual asynchronous continuation behavior from already-completed tasks; they prove exactly-once initialization for normal and fallback paths.
      - User-facing failure messages in the implementation come from CoreStrings, with actual additions to the staged CoreStrings.resx when necessary. The agent does not hand-edit a generated designer and identifies its generation step in analysis.md. It preserves the original failure as an inner exception when translating construction failures rather than silently swallowing it.
      - The written xUnit tests have substantive assertions for factory success, null result with fallback disabled, fallback success, construction or fallback failure, callback failure, argument validation, and disposed contexts. They include a handler without a public parameterless constructor and verify that a successful first factory does not invoke the fallback. A list of suggested tests is insufficient. The analysis distinguishes unexecuted snapshot tests and requests API-baseline validation of the implemented surface.
    graders:
      - type: file-matches
        config:
          path: activation-proposal.cs
          pattern: '(?=[\s\S]*namespace Microsoft\.EntityFrameworkCore)(?=[\s\S]*Task<THandler>)(?=[\s\S]*ConfigureAwait\(false\))(?=[\s\S]*CoreStrings\.)[\s\S]+'
      - type: file-matches
        config:
          path: activation-tests.cs
          pattern: '(?=[\s\S]*\[(?:Fact|Theory)\])(?=[\s\S]*Assert\.)(?=[\s\S]*SynchronizationContext)(?=[\s\S]*TaskCompletionSource)[\s\S]+'
      - type: prompt
        config:
          scoring: binary
          threshold: 1.0
          evidence: [ trajectory, repo ]
      - type: token-budget
        config:
          max: 1000000
scoring:
  weights:
    file-matches: 0.2
    prompt: 0.7
    token-budget: 0.1
  threshold: 0.8
